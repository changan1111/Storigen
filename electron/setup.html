<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Storigen</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f6f8;color:#1b2430}
.box{background:#fff;border:1px solid #d9dee5;border-radius:10px;padding:28px 32px;width:min(520px,92vw)}
h1{margin:0 0 4px;font-size:22px}p{margin:.4rem 0 1rem;color:#56606d}
input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;border:1px solid #b9c1cc;border-radius:6px}
button{margin-top:14px;padding:10px 18px;font-size:15px;border:0;border-radius:6px;background:#1f6feb;color:#fff;cursor:pointer}
.err{background:#fdecea;color:#8a1f17;border:1px solid #f1b8b3;border-radius:6px;padding:10px 12px;margin-bottom:14px;display:none}
small{display:block;margin-top:10px;color:#56606d}
</style></head>
<body><form class="box" id="f">
<h1>Storigen</h1>
<p>Type the address of the Storigen server (the Mac mini that runs it).</p>
<div class="err" id="err"></div>
<input id="addr" type="text" autocomplete="off" spellcheck="false" aria-label="Server address" placeholder="http://janamedit01.local:8081">
<button type="submit">Connect</button>
<small>It is remembered. Change it later from the menu: Storigen &gt; Change server address.</small>
</form><script src="setup.js"></script></body></html>
